<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Roast My Aux{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{ url_for('home') }}">Roast My Aux <span aria-hidden="true">🔥</span></a>
        {% if session.get('token_info') %}
            <a class="link" href="{{ url_for('logout') }}">Log out</a>
        {% endif %}
    </header>

    <main class="card">
        {% block content %}{% endblock %}
    </main>

    <footer class="foot">Not affiliated with Spotify. Roasts are jokes — your taste is probably fine.</footer>
</body>
</html>
